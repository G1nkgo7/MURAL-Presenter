name: Paper release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: ${{ github.workspace }}/.runtime/tmp
      MURAL_RUNTIME_CONFIG: ${{ github.workspace }}/configs/runtime.local.json
      MURAL_SECRETS_ENV_PATH: ${{ github.workspace }}/.runtime/no-secrets.env
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/browsers
      STUDIO_DATA_DIR: ${{ github.workspace }}/.runtime/studio-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install uv
      - run: mkdir -p .runtime/tmp .runtime/tests
      - run: uv sync --project webui/inference --frozen
      - run: uv sync --project webui/studio --frozen
      - name: Resolve local deployment configuration
        run: |
          unset MURAL_RUNTIME_CONFIG
          python -c 'import sys; sys.path.insert(0,"scripts"); from runtime_environment import prepare_environment; prepare_environment()'
      - run: python tools/check_paper_release.py
      - name: Portable WebUI integration
        run: uv run --project webui/studio --with pytest --with httpx python -m pytest tests/test_portable_release.py tests/test_webui_http.py tests/test_webui_subpath.py tests/test_cci_gateway.py -q -p no:cacheprovider --basetemp=.runtime/tests/portable
      - name: Runtime release and configuration contracts
        run: uv run --project webui/inference --with pytest python -m pytest -p tools.pytest_portable_runtime harnesses/mural-presenter-v1/tests/test_release_guard.py harnesses/mural-presenter-v1/tests/test_config.py -q -p no:cacheprovider --basetemp=.runtime/tests/contracts
      - name: WebUI configuration and active runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/webui:${{ github.workspace }}/webui/studio
        run: uv run --project webui/studio --with pytest python -m pytest webui/tests/test_service_config.py webui/studio/tests/test_harness_retirement.py webui/studio/tests/test_mural_profiles.py -q -p no:cacheprovider --basetemp=.runtime/tests/webui
      - name: Install browser for WebUI regressions
        run: uv run --project webui/studio python -m playwright install --with-deps --only-shell chromium
      - name: WebUI live feed, preview and font regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/webui:${{ github.workspace }}/webui/studio
        run: >-
          uv run --project webui/studio --with pytest --with httpx python -m pytest
          webui/studio/tests/test_livefeed_performance.py
          webui/studio/tests/test_static_preview_race.py
          webui/studio/tests/test_static_preview_geometry.py
          webui/studio/tests/test_pinned_font_preview.py
          webui/studio/tests/test_owner_workflow.py
          webui/studio/tests/test_startup_observability.py
          webui/tests/test_font_release_hermetic.py::FontDeclarationParityTests
          -q -p no:cacheprovider --basetemp=.runtime/tests/webui-regressions
      - name: Example deployment configuration
        run: python webui/scripts/launch.py --check --no-install --no-browser-install --env-file webui/.env.example
