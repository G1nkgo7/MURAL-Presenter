name: Public surface

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_public_release.py

  site:
    name: Bilingual site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  studio:
    name: SenseNova Present Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --project harnesses/mural-presenter --frozen
      - run: >-
          uv run --frozen
          --project harnesses/mural-presenter
          --with pytest
          pytest -q -p no:cacheprovider
          harnesses/mural-presenter/tests
      - run: >-
          uv run --frozen
          --project apps/studio/sensenova_present/studio
          --with pytest
          pytest -q -p no:cacheprovider
          apps/studio/sensenova_present/studio/tests
      - run: >-
          apps/studio/sensenova_present/start.sh
          --check --no-install --no-browser-install

  studio-platforms:
    name: Studio launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --project apps/studio/sensenova_present/studio --frozen
      - run: uv sync --project harnesses/mural-presenter --frozen
      - name: Check launcher on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          apps/studio/sensenova_present/start.sh
          --check --no-install --no-browser-install
      - name: Check launcher on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./apps/studio/sensenova_present/start.ps1
          -Check -NoInstall -NoBrowserInstall
