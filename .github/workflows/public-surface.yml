name: Public surface

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_public_release.py

  site:
    name: Bilingual site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  studio:
    name: SenseNova Present Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: >-
          uv run --frozen
          --project apps/studio/sensenova_present/studio
          --with pytest
          pytest -q -p no:cacheprovider
          apps/studio/sensenova_present/studio/tests
