contract_version: case_special_rubric_v1
case_revision: v001
case_id: plasma_ammonia_technical_background
instruction: instruction.md
case_scale:
  min: 0
  max: 100
  aggregation: arithmetic_mean
  bands:
  - level: not_met
    min: 0
    max: 19
    description: 几乎没有满足该指标，核心对象缺失、不可用或方向完全错误。
  - level: weak
    min: 20
    max: 39
    description: 只满足少量表层要求，主要组成部分缺失或存在严重错误。
  - level: partial
    min: 40
    max: 59
    description: 约一半要求得到满足，但仍有影响理解或使用的实质缺漏。
  - level: mostly
    min: 60
    max: 79
    description: 大部分要求得到满足，剩余问题清楚可见但未破坏主体。
  - level: fully
    min: 80
    max: 100
    description: 完整满足要求；80 是基线完整，90 表示执行扎实，95 表示仅有极小改进空间，100 仅用于无可观察缺陷。
review:
  confidence_threshold: 0.7
criteria:
- name: 单页 HTML 与画布比例
  evaluation_mode: html
  requirement: 交付物为单页 HTML，页面画布比例为 16:9。
  evaluation: 以 HTML/DOM 为主证据。确认交付入口能够独立打开；识别承担整页内容的唯一主幻灯片容器，读取其 computed width、height 和 bounding box，并计算 width/height。浏览器截图缩放不改变页面设计比例；纵向堆叠多个满屏容器、轮播中的多页或需要滚动才能看到第二页均不算单页。最新
    instruction 只要求 16:9，不额外要求 1920×1080、固定根节点标签或固定 id。
  anchors:
    not_met: '0–19: 没有可打开的 HTML，运行后无可见幻灯片，或完全无法识别主画布及其尺寸。'
    weak: '20–39: HTML 可以打开，但明显包含多页/多屏内容，或主画布比例严重偏离 16:9；单页与比例两项核心要求大多不满足。'
    partial: '40–59: 单页和 16:9 中仅一项可靠满足；或者看似单页但存在第二个满屏容器，或画布比例与 16:9 有约 2%–5% 的明显偏差。'
    mostly: '60–79: 可确认是单页 HTML 且画布接近 16:9，仅有重复包装容器、轻微滚动或约 1%–2% 的比例偏差，不影响主体完整显示。'
    fully: '80–100: 唯一可见幻灯片完整位于单个 HTML 页面中，画布宽高比与 16:9 的偏差不超过约 1%。80 表示基线满足；90+ 要求 DOM 结构清楚、无第二页和无滚动歧义；100 要求没有可观察的结构或比例缺陷。'
- name: 科研答辩风格与配色
  evaluation_mode: visual
  requirement: 整页采用清晰、专业的科研答辩风格；强调色限定为蓝、白、红，同时通过层次、明暗或版式变化避免页面过于单调。
  evaluation: 以整页渲染图为主证据，检查是否适合科研答辩和专家/同行快速阅读：版式应克制、信息层级清楚、图示和文字具有学术表达感。检查白色或极浅背景、蓝色标题/结构件、红色重点是否形成稳定体系；中性灰可用于正文、边框和阴影，不视为额外强调色。若绿、橙、紫等颜色只占极小面积且不形成视觉层级，可视为轻微问题；若其承担标题、核心数字、箭头或大面积模块强调，则违反配色要求。营销海报、暗黑娱乐科技风、卡通儿童风均不符合场景。
  anchors:
    not_met: '0–19: 整体明显不是科研答辩页面，呈营销、娱乐、卡通或杂乱模板风；主视觉大量依赖蓝白红之外的强调色，且信息层级不可读。'
    weak: '20–39: 只有局部学术元素，整体仍显业余、花哨或极度单调；出现多个额外强调色，或文字、图示、模块之间缺少清楚层级。'
    partial: '40–59: 基本具有科研答辩方向，蓝白红是主要配色，但仍有一项显著问题，例如额外颜色形成竞争重点、版式过度装饰、信息密度失衡或层级扁平。'
    mostly: '60–79: 风格清晰专业，蓝白红强调体系基本稳定，专家可快速扫描；只存在少量颜色越界、局部单调、对比度或层级不够精炼的问题。'
    fully: '80–100: 科研答辩语境明确，蓝白红及其中性明度变化使用克制且一致，内容层级、留白和图示表达专业而不单调。80 表示完整合格；90+ 表示视觉语言成熟统一；100 仅用于无可见配色或风格缺陷。'
- name: 页面主标题
  evaluation_mode: visual
  requirement: 标题“等离子体催化合成氨的技术背景”位于页面顶部，并且是全页字号最大、视觉上最醒目的文字。
  evaluation: 以渲染图为主、DOM 文本和 computed font-size 为辅助。标题文字必须逐字表达“等离子体催化合成氨的技术背景”，允许引号、标点、空格和换行差异，但不得改写或缺词。检查标题是否位于页面顶部标题区，并将其字号与其他所有可见文字比较；还要结合字重、颜色、留白和位置判断它是否是全页第一视觉层级。最新
    instruction 没有规定具体像素字号或必须使用深蓝色，不应沿用旧版 60px 阈值。
  anchors:
    not_met: '0–19: 指定标题完全缺失、主体文字错误到无法对应主题，或被裁切/遮挡到不可读。'
    weak: '20–39: 只能找到部分标题或近义短语；标题不在顶部，且字号、字重和视觉位置均未形成主标题层级。'
    partial: '40–59: 标题文字大体正确且位于上部，但存在明显缺词/错词；或者文字准确却不是全页最大字号，视觉显著性与小标题接近。'
    mostly: '60–79: 标题准确完整、位于顶部且基本是最大最醒目的文字，仅有轻微的字号竞争、留白不足、对比度不足或局部裁切。'
    fully: '80–100: 标题逐字准确、完整可读并稳定占据顶部标题区，computed font-size 大于其他文字且视觉上明确统领全页。80 表示三项要求均满足；90+ 要求层级和留白执行扎实；100 要求无任何可观察缺陷。'
- name: 技术优势区结构与顺序
  evaluation_mode: visual
  requirement: 标题下方的技术优势区从左到右依次呈现：竖排“技术优势”、优势句、能量—反应过程曲线、氮分子活化说明、“低能耗”箭头及其指向的结论。
  evaluation: 以渲染图为主证据，先定位标题下方的第一内容区，再按视觉阅读路径检查六个结构节点：①竖排“技术优势”；②优势句；③能量—反应过程曲线；④氮分子活化说明；⑤标注“低能耗”的大箭头；⑥箭头指向的结论。允许各节点有轻微上下错落，但主要阅读方向必须从左到右，箭头和空间邻接应形成连续因果链。本项只评价结构、顺序和连接，不因单个节点内部文字的轻微错误重复扣分。
  anchors:
    not_met: '0–19: 标题下方没有可识别的技术优势区，或六个结构节点仅零散出现一个且无顺序关系。'
    weak: '20–39: 只能识别一至两个节点，主要节点大多缺失；布局呈散点或错序，无法形成从优势到结论的阅读链。'
    partial: '40–59: 可识别三至四个节点并看出技术优势主题，但至少两个节点缺失，或存在明显错序、跨区跳读和箭头关系断裂。'
    mostly: '60–79: 可识别五至六个节点，主要顺序正确并基本形成从左到右的信息链；仅有一个节点弱化、局部错位或一处连接关系不够清楚。'
    fully: '80–100: 六个节点全部可识别，顺序与 instruction 一致，轻微上下错落不破坏从左到右的因果链，低能耗箭头明确连接结论。80 表示结构完整；90+ 要求阅读路径自然；100 要求无错序、断裂或歧义。'
- name: 技术优势核心表述
  evaluation_mode: visual
  requirement: 技术优势区清楚呈现“等离子体可通过电气手段高效激发与精准调控”。
  evaluation: 以渲染文字为主、DOM/SVG 可见文本为辅助，在技术优势区内核对完整表述。允许标点、空格、全半角和断行差异；不得用含义更弱的泛化句替代。分别检查三个核心语义：①通过电气手段；②高效激发；③精准调控。若文字存在于 HTML
    但在画面中被裁切、遮挡或字号小到不可读，不能视为完整满足。
  anchors:
    not_met: '0–19: 指定表述完全缺失，或出现与电气激发和调控无关、甚至含义相反的文字。'
    weak: '20–39: 只出现“等离子体”等主题词，三个核心语义中满足不超过一个，或整句几乎不可读。'
    partial: '40–59: 三个核心语义满足两个，但遗漏或实质改写另一个；或者语义完整但有明显裁切、遮挡或可读性问题。'
    mostly: '60–79: 三个核心语义全部保留，文字位于技术优势区且基本清晰，仅有轻微措辞、标点、断行或视觉层级问题。'
    fully: '80–100: 完整、准确、清晰地呈现指定优势句，三个核心语义无遗漏，文字在技术优势区中易于快速识别。80 表示内容完整；90+ 要求呈现自然清楚；100 要求无文字和可读性缺陷。'
- name: 活化能垒曲线
  evaluation_mode: visual
  requirement: 能量—反应过程曲线示意图包含纵轴“能量”、横轴“反应过程”、N₂+3H₂→2NH₃ 反应式，以及可辨识的活化能垒峰形曲线。
  evaluation: 以渲染图为主证据，分别检查四个可观察组成：①纵轴表达能量；②横轴表达反应过程；③曲线呈现从反应物状态上升至活化峰再下降至产物状态的合理单峰能垒语义；④标注配平正确的 N₂+3H₂→2NH₃。轴文字允许“Energy/Reaction
    coordinate”等等价表述，反应式允许 N2、H2、NH3 普通数字写法和空格差异，但化学计量必须相同。不得要求具体能垒数值；若额外出现来源不明的能垒数字，应在“科学数据与成品完整性”项扣分。
  anchors:
    not_met: '0–19: 能垒图缺失，或只有与能量—反应过程无关的装饰曲线；四个组成均不可识别。'
    weak: '20–39: 四个组成只满足一个，例如只有一条无坐标含义的峰形线或只有孤立反应式，无法理解为活化能垒图。'
    partial: '40–59: 四个组成满足两个，或满足三个但存在实质科学错误，例如反应式未配平、横纵轴颠倒或曲线没有合理活化峰语义。'
    mostly: '60–79: 四个组成满足至少三个且整体科学含义正确；剩余问题限于一个缺失标注、较弱的峰形表达、文字过小或轻微可读性不足。'
    fully: '80–100: 能量纵轴、反应过程横轴、合理单峰能垒曲线和配平正确的反应式全部清楚呈现，无需具体数值即可理解。80 表示四项齐全；90+ 要求图示关系清楚；100 要求无科学和视觉表达缺陷。'
- name: 氮分子活化与低能耗结论
  evaluation_mode: visual
  requirement: 技术优势区包含说明“外部电场可使氮分子活化，打破氮气化学惰性”，并以标注“低能耗”的大箭头指向结论“能耗理论极限不到哈伯-博施法的 25%”。
  evaluation: 以渲染图为主、可见 DOM/SVG 文本为辅助，分别检查四个组成：①完整表达外部电场使氮分子活化并打破惰性的说明；②清楚标注“低能耗”的大箭头；③箭头在空间和方向上明确指向结论；④结论准确表达“能耗理论极限不到哈伯-博施法的
    25%”。允许标点、换行和全半角差异，但不得将“不到”改为“等于”“约为”或其他改变结论强度的说法。最新 instruction 没有要求箭头和 25% 必须为红色或指定字号，不以旧版颜色/字号约束扣分。
  anchors:
    not_met: '0–19: 四个组成均缺失，或页面明确表达相反结论，例如外部电场使氮气更惰性、能耗等于/高于哈伯-博施法。'
    weak: '20–39: 四个组成只满足一个，文字严重残缺，或有“低能耗”装饰但没有箭头和 25% 结论关系。'
    partial: '40–59: 四个组成满足两个；或者内容基本齐全但出现实质错误，例如遗漏“不到”、箭头没有指向结论或活化说明被改写到丢失因果。'
    mostly: '60–79: 四个组成全部可识别且主要语义正确，仅有一处轻微文字缺漏、箭头指向不够精确、视觉强调不足或可读性问题。'
    fully: '80–100: 活化说明完整准确，“低能耗”大箭头清楚指向“不到 25%”结论，文字、方向和因果链均无歧义。80 表示四项完整；90+ 要求视觉关系强而自然；100 要求无可观察缺陷。'
- name: 下半部分双栏与左栏内容
  evaluation_mode: visual
  requirement: 页面下半部分采用左右双栏；左栏顶部为“等离子体与催化剂的协同作用”，其下分别介绍“反应路径优化”和“降低能耗壁垒”。
  evaluation: 以渲染图为主证据，检查四个组成：①标题下方第二部分位于页面下部并形成可辨认的左、右两栏；②左栏顶部标题准确表达“等离子体与催化剂的协同作用”；③左栏包含“反应路径优化”的介绍；④左栏包含“降低能耗壁垒”的介绍。两项介绍应各自具有可辨识的标题或内容块，不能只是散落关键词。最新
    instruction 未规定两栏必须等宽，也未规定旧版 box 的固定条目、颜色和逐字文本，不得据此额外扣分。
  anchors:
    not_met: '0–19: 页面下部没有双栏结构，左栏标题和两项介绍均无法识别。'
    weak: '20–39: 四个组成只满足一个，例如只有一个孤立标题或零散关键词；左右栏关系不成立。'
    partial: '40–59: 四个组成满足两个，能看出下部协同作用区域，但至少一项介绍缺失，或双栏/标题层级存在明显结构错误。'
    mostly: '60–79: 四个组成全部存在，左右栏和左栏层级基本清楚；仅有一项介绍过于简略、标题位置略弱或栏间关系不够明确。'
    fully: '80–100: 下部左右双栏清楚成立，左栏顶部标题准确，“反应路径优化”和“降低能耗壁垒”均有独立且可读的介绍。80 表示四项完整；90+ 要求层级清晰易扫读；100 要求无结构和内容缺陷。'
- name: 等离子体与催化剂协同示意图
  evaluation_mode: visual
  requirement: 右栏示意图展示 N₂、H₂ 分子进入等离子体区、到达催化剂表面并最终生成 NH₃ 的过程；N₂、H₂、NH₃、催化剂均有文字标注，物种流向用箭头或连线表达。
  evaluation: 以右栏渲染图为主证据，按两组要求检查。标注组共四项：N₂、H₂、NH₃、催化剂；允许 N2/H2/NH3 普通数字写法和 Catalyst 等等价英文。过程组共四项：①N₂/H₂ 进入等离子体区；②从等离子体区到达催化剂表面；③在催化剂作用后生成
    NH₃；④用有方向的箭头或语义明确的连线串成可读过程链。只有散落标签、无方向连线、装饰性分子图标或无法判断起终点时，不能视为完整流程。
  anchors:
    not_met: '0–19: 右栏协同示意图缺失，或只存在无法对应反应过程的装饰图形；标注组和过程组均基本不满足。'
    weak: '20–39: 八个检查项满足不超过两个，通常只有一两个分子标签或孤立图标，没有可读的进入、到达和生成关系。'
    partial: '40–59: 八个检查项满足三至五个；可以判断协同作用主题，但缺少多个物种/部件标注，或过程链在等离子体区、催化剂表面、NH₃ 生成之间断裂。'
    mostly: '60–79: 八个检查项满足六至七个，四类核心对象和主要过程基本可读；仅有一个标注缺失、一个阶段弱化或局部箭头方向不够明确。'
    fully: '80–100: 八个检查项全部满足，N₂、H₂、NH₃、催化剂标注齐全，箭头或连线清楚表达进入等离子体区、到达催化剂表面并生成 NH₃ 的完整过程。80 表示完整；90+ 要求流程一眼可读；100 要求无标注和方向歧义。'
- name: 科学数据与成品完整性
  evaluation_mode: html
  requirement: 除 instruction 已给出的 25% 外，不编造转化率、温度、压强、能垒等具体实验数值，页面中也不保留占位文字。
  evaluation: 以 HTML/DOM/SVG 中的用户可见文本、无障碍文本和渲染结果为证据，扫描百分比、带单位数字、温度、压强、能垒、转化率等性能数据，同时检查 lorem ipsum、TODO、TBD、待补充、占位符、示例文本和未替换模板字段。instruction
    明确给出的 25% 可以使用；16:9、化学计量系数、画布尺寸、序号和章节编号不属于实验性能数据。若出现 instruction 未提供的具体实验数值，只有在页面明确给出可核验来源时才可接受；来源不明的性能数字应视为编造风险。不要因为缺少
    instruction 未要求的论文级数据而扣分。
  anchors:
    not_met: '0–19: 存在多处来源不明的具体实验性能数值，或页面包含大量占位/模板文字，已明显破坏科学可信度和成品状态。'
    weak: '20–39: 至少存在一处会改变技术判断的明确编造数值，或存在多处 TODO、TBD、待补充、lorem ipsum、未替换变量等占位内容。'
    partial: '40–59: 未发现大规模编造，但仍有一处来源不明的转化率、温度、压强或能垒数值；或者有一处醒目的占位/未完成文本。'
    mostly: '60–79: 没有明确编造的实验性能数据和明显占位文字，仅有一处边界可疑内容需要复核，例如来源标注不清的数字、隐藏但可能面向用户的模板文本。'
    fully: '80–100: 除给定 25% 以及比例、化学计量、尺寸和序号等非实验数据外，没有来源不明的具体性能数值；所有用户可见及无障碍文本均为完成态。80 表示未发现违规；90+ 要求 DOM 与渲染均干净；100 要求无任何可疑残留。'
