#     description: 外部页级 Rubric 生成每页 Content、Aesthetic、HTML 模块分；本文件不重复定义页级维度。
#     slide_score_aggregation: 70% 全页均值 + 30% 最差 max(1, ceil(20% × N)) 页均值
#     allow_na: 封面、章节页等确实不适用的页级维度可由页级 Rubric 填 N/A，并在模块内动态处理分母。
#   final_score_aggregation:
#     slide_level_weight: 0.55
#     deck_level_weight: 0.45
#     formula: Base Score = 55% Slide-level Aggregate + 45% Deck Score；Valid 时 Final Score = min(Base Score, Rule Cap)。

global_caps:
  - id: missing_core_structure
    max_final_score: 59
    condition: 核心章节缺失或实现目标用途所必需的路径缺失，导致 Deck 只能表层对应任务。
  - id: widespread_deck_unavailability
    max_final_score: 39
    condition: 坏页数量达到 max(2, ceil(0.1 × N))，或任一核心章节不可达。
  - id: deliberate_deck_level_evaluation_gaming
    max_final_score: 39
    max_html_module_score: 19
    condition: 存在不可达隐藏内容、延迟注入或其他明确投机实现，以规避 Deck-level 评测。
