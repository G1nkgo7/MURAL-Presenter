contract_version: single_page_image_rubric_v1
rubric_id: single_page_image_rubric_v1
title: 单页演示文稿通用评测 Rubric
source: single_page_image_rubric_v1.xlsx

scope:
  total_dimensions: 10
  modules:
    content: 4
    aesthetic: 5
    html: 1

dimension_scale:
  min: 0
  max: 100
  bands:
    - level: not_met
      min: 0
      max: 19
      description: 几乎没有满足该维度，核心对象缺失、不可用或存在根本性错误。
    - level: weak
      min: 20
      max: 39
      description: 只满足少量表层要求，主要组成、关系或质量标准存在严重问题。
    - level: partial
      min: 40
      max: 59
      description: 基本方向成立，但仍有影响理解、使用或专业性的实质缺漏。
    - level: mostly
      min: 60
      max: 79
      description: 大部分要求得到满足，剩余问题清楚可见但未破坏主体质量。
    - level: fully
      min: 80
      max: 100
      description: 完整满足该维度；80 是基线完整，90 表示执行扎实，95 表示仅有极小改进空间，100 仅用于无可观察缺陷。

judge_instructions:
  - 对每个可评分维度分别给出 0–100 分，不要把多个维度合并成一个印象分。
  - 先根据 anchors 选择分数档，再根据实际完成质量和剩余缺陷确定档内具体分数。
  - 每个维度都必须给出可定位的证据、主要缺陷和简洁评分理由。
  - 分数低于 100 时必须指出至少一个该维度内的具体不足；只有无可观察缺陷时才可给 100。
  - 不要由 Judge 计算总分、模块权重、限分或降档；外部聚合器按 Judge 分组分别计算无权重算术平均。
  - 所有维度都必须给出 0–100 数值分；不允许填写 N/A。缺少必要交付物时由 runner 直接报错。

dimensions:
  - id: C1_core_message
    module: content
    name: 单页核心主旨
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - instruction
      - rendered_image
    definition: 这一页是否有清晰中心观点，而不是信息散点堆砌。
    evaluation: >-
      先结合 instruction 判断这一页应传达的主题、结论或核心判断，再检查标题、正文、图表和视觉元素是否共同服务同一主旨。
      不要只因为页面有标题或关键词就判定主旨成立；需要确认读者能在短时间内说出“这一页最想让我记住什么”。
      如果页面包含多个信息块，还要判断它们是否构成支撑关系，而不是彼此无关的并列堆砌。
    anchors:
      not_met: 0–19：看不出页面想表达什么；主题和结论缺失，标题、正文和视觉元素像随机拼贴，无法形成可复述的核心信息。
      weak: 20–39：能看出一个宽泛主题，但没有明确结论或中心判断；标题泛泛，正文与视觉没有共同指向，读者只能复述关键词而不能复述主旨。
      partial: 40–59：有基本主旨，但表达较普通、泛化或不够聚焦；部分信息没有服务主旨，或核心判断需要读者自行推断。
      mostly: 60–79：主旨清楚，标题、正文、图表和视觉元素基本围绕同一核心信息展开；仅有少量次要内容游离、结论不够凝练或强调不足。
      fully: 80–100：主旨高度凝练，一眼能看懂页面想让读者记住什么，所有主要信息都在强化该判断。80 表示主旨完整清楚；90+ 要求表达有力度且支撑关系自然；100 要求没有游离信息或主旨歧义。
    notes:
      - 如果标题只是“市场分析”“项目介绍”等泛泛主题，且页面没有中心结论，本维度最高进入 partial 档，即不高于 59 分。

  - id: C2_information_accuracy_and_value
    module: content
    name: 信息准确性与有效信息
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - instruction
      - rendered_image
    definition: 内容是否准确、有信息增量、有具体事实、案例或论据，并避免编造以及数据、图表和正文之间的不一致。
    evaluation: >-
      检查页面中的事实、数字、单位、时间、对象关系、图表编码和文字结论是否相互一致，并与 instruction 已知信息一致。
      区分“缺少具体证据”和“明确事实错误”：前者影响信息价值，后者直接影响准确性。
      对无法从给定材料核验的专业结论保持审慎，不要因 Judge 自身无法确认就臆断为错误；但来源不明的精确数据、伪造引用或明显因果颠倒应作为严重缺陷。
    anchors:
      not_met: 0–19：内容空洞，或存在严重事实错误、关键数字错误、伪造数据、伪造来源、图文结论冲突等问题，已无法信任或使用。
      weak: 20–39：套话多、有效信息很少；存在多处事实偏差，或数据与图表、正文明显不一致，具体论据不足以支撑页面结论。
      partial: 40–59：内容基本准确，但偏常识性或泛泛而谈；具体证据、数据、案例或分析不足，存在少量不影响主体方向的模糊或不一致。
      mostly: 60–79：信息准确且有用，包含具体数据、案例、论据或清晰分析，图表与文字结论基本一致，没有关键错误；仅有轻微证据缺口或表达不够严谨。
      fully: 80–100：信息专业、有洞察，能够形成高质量判断；数据、图表、事实和文字结论高度一致且支撑充分。80 表示准确有用；90+ 要求信息增量和论证质量突出；100 要求无可见事实、数据或逻辑缺陷。
    notes:
      - 严重事实错误、伪造数据或伪造来源应落入 not_met 或 weak 档；模块级限分由外部聚合器处理。

  - id: C3_focus_and_information_selection
    module: content
    name: 信息取舍与单页聚焦
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - instruction
      - rendered_image
    definition: 内容是否适合在一页内讲清楚，是否避免过载、过空、冗余以及重点不突出。
    evaluation: >-
      从单页沟通效率出发，判断核心信息、支撑信息和细节是否分层，并检查每个主要内容块是否有存在价值。
      文字数量本身不是扣分依据；关键是信息密度是否匹配使用场景、是否能在有限画布中被清楚组织。
      同时检查是否为了简洁而删掉必要论据，或者为了显得充实而加入重复、旁支和无法快速阅读的细节。
    anchors:
      not_met: 0–19：信息严重失控、无法阅读，或几乎没有有效内容；页面既不能完成核心沟通，也无法辨认合理的内容层级。
      weak: 20–39：明显过载或过空；重点被大量冗余信息淹没，或只有口号和标题没有支撑，单页阅读成本很高。
      partial: 40–59：信息量基本足够，但主次关系不够清楚，存在可见冗余、遗漏、重复或局部密度失衡，核心内容仍需读者自行筛选。
      mostly: 60–79：取舍合理，重点、补充信息和细节层级清楚，适合单页呈现；仅有少量可删减内容、局部空洞或次要信息强调过度。
      fully: 80–100：复杂内容被压缩成清楚的一页，密度与场景高度匹配，重点和支撑关系自然。80 表示单页聚焦完整；90+ 要求取舍精炼且阅读高效；100 要求没有可见冗余、遗漏或密度问题。
    notes:
      - 文字多不必然扣分；只有在其破坏层级、阅读效率或场景适配时才构成缺陷。

  - id: C4_context_and_audience_fit
    module: content
    name: 场景与受众内容适配
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - instruction
      - rendered_image
    definition: 内容深度、语气、措辞以及业务、技术、教学或营销 framing 是否匹配使用场景和目标受众。
    evaluation: >-
      先从 instruction 识别页面用途、受众、沟通阶段和期望行动，再检查内容深度、专业术语、解释粒度、语气和论证方式是否匹配。
      不要把“更专业”机械等同于“更好”；面对管理者、专家、学生或公众时，合适的信息深度和表达方式不同。
      同时判断页面是否像为该场景专门编写，而不是把通用模板、广告话术或论文段落直接搬入。
    anchors:
      not_met: 0–19：完全不适合目标受众或使用场景，例如技术汇报变成广告口号、公众科普充满无解释术语，或业务决策页只呈现无结论的学术细节。
      weak: 20–39：多数内容错位，语气、深度、术语或表达方式与受众需求明显不匹配，目标用户难以直接使用页面。
      partial: 40–59：大方向基本合适，但部分内容太浅、太深、太口号化或太学术化；存在明显的场景模板感或解释粒度偏差。
      mostly: 60–79：内容深度和语气基本匹配目标受众与使用场景，主要信息可直接用于沟通；仅有轻微术语、措辞、论证粒度或 framing 偏差。
      fully: 80–100：高度贴合受众和场景，像是为该场景专门写的一页，可直接用于目标沟通。80 表示适配完整；90+ 要求措辞、深度和论证方式精准；100 要求无可观察的受众或场景错位。

  - id: A1_composition_layout
    module: aesthetic
    name: 构图与版式组织
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - rendered_image
    definition: 评估画面组织、视觉重心、留白、比例、对齐、节奏以及阅读或观看路径。
    evaluation: >-
      只根据最终渲染结果评价。先识别主要视觉中心和内容区域，再检查主次关系、对齐系统、留白分配、模块比例和阅读路径。
      区分有意的非对称构图与无意失衡；局部拥挤或大留白只有在破坏重心、路径或信息可读性时才应明显扣分。
    anchors:
      not_met: 0–19：构图失效；主体散乱或缺失，画面没有稳定重心，主要元素堆叠、错位、拥挤或分散到难以观看。
      weak: 20–39：构图弱成立；能看出基本布局，但主次不明、重心不稳、观看路径混乱，对齐和空间组织明显吃力。
      partial: 40–59：构图基本合格；主体和主要区域能识别，画面有基本秩序，但留白、层级、对齐、节奏仍有明显优化空间。
      mostly: 60–79：构图良好；视觉中心明确，主次关系清楚，阅读或观看路径基本自然，仅有局部轻微拥挤、失衡或节奏问题。
      fully: 80–100：构图优秀；画面组织成熟，重心、留白、节奏、比例和路径高度协调，注意力被有效引导。80 表示成熟完整；90+ 要求几乎无需调整；100 要求无可见版式缺陷。

  - id: A2_visual_elements_hierarchy
    module: aesthetic
    name: 视觉元素与层次结构
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - rendered_image
    definition: 评估色彩、明暗、形态、字形、图像、文字块关系、空间层次和主体层级。
    evaluation: >-
      根据渲染结果检查配色关系、对比度、形态一致性、文字与图形的空间关系，以及读者能否迅速区分标题、主体、支撑信息和背景。
      不以元素数量多少直接判断优劣；重点是元素之间是否形成稳定、清楚且有表现力的视觉秩序。
    anchors:
      not_met: 0–19：视觉元素关系失效；色彩、明暗、形态或空间严重冲突，主体层次不可读，画面显著脏乱或破碎。
      weak: 20–39：视觉元素弱成立；能辨认主要元素，但配色、光影、形体、文字块关系或空间层次存在明显问题，视觉重点相互竞争。
      partial: 40–59：视觉元素基本合格；色彩和明暗关系大体成立，主体层次可读，但协调性、精致度或空间组织一般。
      mostly: 60–79：视觉元素良好；配色、光影、字形、图像、形态和层级较协调，主体突出，画面有稳定秩序，仅有少量局部冲突。
      fully: 80–100：视觉元素优秀；色彩、明暗、字形、图像、形态、材质和空间关系高度统一且有表现力，层次清楚丰富。80 表示完整协调；90+ 要求精致成熟；100 要求无可见视觉关系缺陷。

  - id: A3_technical_execution
    module: aesthetic
    name: 技术执行与生成完成度
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - rendered_image
    definition: 评估主体稳定性、清晰度、细节、边缘、纹理、文字、渲染状态和导出质量。
    evaluation: >-
      只评价最终可见结果的制作完成度。检查主体是否崩坏或畸形，文字是否乱码、错字、模糊或裁切，图形边缘、纹理、阴影和对齐是否稳定，以及是否存在加载失败、导出损坏或半成品痕迹。
      风格化处理本身不是技术缺陷，除非它造成内容不可读、主体结构错误或明显非预期伪影。
    anchors:
      not_met: 0–19：技术执行失败；主体崩坏、严重畸形、严重模糊、渲染损坏或半成品状态明显，无法作为完整视觉结果。
      weak: 20–39：主体能辨认，但存在明显 AI 畸形、纹理错误、文字错误、边缘破损、渲染异常、错位或完成度不足。
      partial: 40–59：整体可用、主要内容完整，但局部清晰度、细节、边缘、文字、材质或导出质量有明显优化空间。
      mostly: 60–79：画面清晰完整，主体稳定，细节较扎实，仅有少量不影响主体观感的小瑕疵。
      fully: 80–100：生成或制作完成度高，细节、边缘、纹理、渲染、文字和元素状态稳定自然。80 表示完整稳定；90+ 要求仅有极小瑕疵；100 要求无可见技术缺陷。

  - id: A4_style_media_topic_fit
    module: aesthetic
    name: 风格统一与媒介/主题适配
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - instruction
      - rendered_image
    definition: 评估字体、色彩、图像、装饰、材质和组件语言与主题、媒介及使用场景的一致性。
    evaluation: >-
      结合 instruction 和渲染结果，判断页面是否形成一致的视觉语言，以及该语言是否适合单页演示媒介、主题气质和使用场景。
      检查字体、图标、图表、图片、装饰和组件是否像来自同一系统；避免把个人审美偏好误当作统一性标准。
    anchors:
      not_met: 0–19：风格失效；元素像随机拼贴，字体、色彩、图像、装饰、材质或组件语言严重冲突，整体不成体系。
      weak: 20–39：能看出某种风格方向，但素材、字体、图标、图表、装饰或媒介语言混杂，统一性较差且与主题或场景存在明显错位。
      partial: 40–59：整体风格大体统一，满足当前媒介和主题的基本要求，但视觉语言较普通，或局部素材和组件明显不匹配。
      mostly: 60–79：视觉语言清楚统一，素材和组件选择较一致，整体适合对应媒介、主题气质和使用场景，仅有少量局部偏差。
      fully: 80–100：风格系统成熟，字体、配色、材质、图形、组件、媒介特性和主题气质高度一致。80 表示统一适配；90+ 要求系统感和专业度突出；100 要求无可见风格冲突。

  - id: A5_overall_aesthetic_first_impression
    module: aesthetic
    name: 整体美观与第一眼观感
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - rendered_image
    definition: 评估第一眼观感、完整感、协调性、专业质感、吸引力和可观察记忆点。
    evaluation: >-
      先在不放大细节的情况下评价整体第一印象，再结合全页检查这种印象是否由真实的完成度、协调性和视觉吸引力支撑。
      本维度是整体判断，但不能替代其他美学维度；评分理由应指出形成整体观感的具体优点或缺陷，而不是只写“好看”或“不好看”。
    anchors:
      not_met: 0–19：整体观感失败；第一眼明显破碎、刺眼、廉价、混乱或不完整，难以被认为是正常、美观的视觉结果。
      weak: 20–39：画面有少量可取之处，但整体不够舒服、不够稳定或不够完整，美观度明显偏低，主要缺陷主导第一印象。
      partial: 40–59：整体观感基本合格；画面可以接受，主要问题不至于彻底破坏整体，但吸引力、精致度、协调性或记忆点一般。
      mostly: 60–79：第一眼较美观，画面完整协调，有一定吸引力和专业感，少量问题不影响整体印象。
      fully: 80–100：第一眼美观且完成感强，视觉吸引力、整体协调性、专业质感和可观察记忆点突出。80 表示高质量完整结果；90+ 可作为优秀样例；100 要求无可见整体观感缺陷。

  - id: H1_dom_html_css_maintainability
    module: html
    name: DOM/HTML/CSS 可维护与可复编辑
    evaluation_mode: html
    allow_na: false
    evidence_sources:
      - html
      - css
      - dom_audit
    definition: >-
      产物的 HTML、CSS 和 DOM 是否结构清晰、语义化、低耦合，使人或 agent 能低成本二次编辑文案、配色、布局和模块，而不牵一发动全身。
      这是唯一主要看源码、不看渲染图的通用维度。
    evaluation: >-
      结合源码静态检查和 DOM audit，从内容可提取性、结构语义化、样式可维护性、复编辑健壮性四个切面评分。
      重点检查可见文字是否为 DOM/SVG text，是否存在整页图片或 canvas 烧字；结构是否有清楚的语义标签、类名和模块边界；样式是否通过 class、CSS 变量和复用规则集中管理；布局是否主要使用正常流、flex 或 grid，而不是大量脆弱的绝对定位和魔数。
      绝对定位、inline style 或固定像素并非一律扣分，只有当其规模和耦合度显著提高修改成本时才构成缺陷。
    anchors:
      not_met: 0–19：不可复编辑；整页是一张图或 canvas 位图，内容烧进图片，DOM 中取不到主要文本；或全页由绝对定位魔数堆叠，修改任一处即明显崩坏。
      weak: 20–39：极难维护；文本虽在 DOM 中，但满屏 inline style、!important 和重复样式，缺少 class 复用，position:absolute 魔数定位为主，结构几乎无语义。
      partial: 40–59：勉强可维护；有基本 class 和结构，但样式分散、魔数较多、局部严重依赖绝对定位，修改配色、文案或布局需要多处手工同步。
      mostly: 60–79：较好维护；语义结构清晰，样式集中于 class 和少量 CSS 变量，主要使用正常流、flex 或 grid，修改文案和配色成本较低，仅有少量重复或魔数。
      fully: 80–100：高度可复编辑；结构语义化且模块化，配色和尺寸通过 CSS 变量或 token 管理，极少 inline style 与 !important，无脆弱像素堆叠，模块可独立增删。80 表示良好可维护；90+ 要求低耦合且复用成熟；100 要求无可观察的维护性缺陷。
    facets:
      - name: 内容可提取性
        evaluates: 文本和数据是真实 DOM/SVG text，而不是图片或 canvas 位图。
        signals:
          - DOM Text Ratio
          - 整页或大块 img 栅格占比
          - canvas 文本占比
      - name: 结构语义化
        evaluates: 语义标签和类名分区清楚、层级合理，而不是一坨 div 加绝对定位。
        signals:
          - 语义标签比例
          - position:absolute 与 top/left 魔数计数
          - 最大 DOM 嵌套深度
      - name: 样式可维护性
        evaluates: 样式通过 class 和 CSS 变量集中复用，而不是满屏 inline style 或 !important。
        signals:
          - inline style 节点占比
          - '!important 计数'
          - CSS 变量在配色和尺寸中的使用
          - 魔数密度
      - name: 复编辑健壮性
        evaluates: 修改一处不会破坏其他区域，模块边界清楚，无重复拷贝和脆弱像素堆叠。
        signals:
          - 重复样式块
          - 固定像素定位比例
          - 模块能否独立增删
