contract_version: single_page_image_rubric_v2
rubric_id: single_page_image_rubric_v2
title: 单页演示文稿通用评测 Rubric v4
source: single_page_image_rubric_v2.xlsx

scope:
  total_dimensions: 14
  modules:
    content: 4
    aesthetic: 5
    html: 5

dimension_scale:
  min: 0
  max: 100
  bands:
    - level: not_met
      min: 0
      max: 19
      description: 几乎没有满足该维度，核心对象缺失、不可用或存在根本性错误。
    - level: weak
      min: 20
      max: 39
      description: 只满足少量表层要求，主要组成、关系或质量标准存在严重问题。
    - level: partial
      min: 40
      max: 59
      description: 基本方向成立，但仍有影响理解、使用或专业性的实质缺漏。
    - level: mostly
      min: 60
      max: 79
      description: 大部分要求得到满足，剩余问题清楚可见但未破坏主体质量。
    - level: fully
      min: 80
      max: 100
      description: 完整满足该维度；80 是基线完整，90 表示执行扎实，95 表示仅有极小改进空间，100 仅用于无可观察缺陷。

judge_instructions:
  - 对每个可评分维度分别给出 0–100 分，不要把多个维度合并成一个印象分。
  - 先根据 anchors 选择分数档，再根据实际完成质量和剩余缺陷确定档内具体分数。
  - 每个维度都必须给出可定位的证据、主要缺陷和简洁评分理由。
  - 分数低于 100 时必须指出至少一个该维度内的具体不足；只有无可观察缺陷时才可给 100。
  - 不要由 Judge 计算模块分、总分、权重或限分；外部聚合器按 Judge 分组分别计算无权重算术平均。
  - 所有维度都必须给出 0–100 数值分，不允许填写 N/A。缺少标准交付物时由 runner 直接报错。

dimensions:
  - id: C1_core_message
    module: content
    name: 单页核心主旨
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - instruction
      - rendered_image
    definition: 这一页是否有清晰中心观点，而不是信息散点堆砌。
    evaluation: >-
      结合 instruction 判断页面应传达的主题、结论或核心判断，再检查标题、正文、图表和视觉元素是否共同服务同一主旨。
    anchors:
      not_met: 看不出页面想表达什么。主题和结论缺失，信息像随机拼贴。
      weak: 能看出一个主题，但没有明确结论。标题泛泛，正文与视觉没有共同指向。
      partial: 有基本主旨，但表达较普通、泛化或不够聚焦。部分信息没有服务主旨。
      mostly: 主旨清楚，标题、正文、图表或视觉元素基本围绕同一核心信息展开。
      fully: 主旨高度凝练，一眼能看懂页面想让读者记住什么，且所有信息都在强化该判断。
    notes:
      - 如果标题只是市场分析、项目介绍等泛泛主题，但页面没有中心结论，本项最高 59 分。

  - id: C2_information_accuracy_and_value
    module: content
    name: 信息准确性与有效信息
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - instruction
      - rendered_image
    definition: 内容是否准确、有信息增量、有具体事实、案例或论据，并避免编造以及数据不一致。
    evaluation: >-
      检查事实、数字、单位、时间、对象关系、图表编码和文字结论是否相互一致，并与 instruction 的已知信息一致。
    anchors:
      not_met: 内容空洞或存在严重事实错误、关键数字错误、伪造数据或伪造来源。
      weak: 套话多，有效信息很少。存在多处事实偏差或数据与图表、正文明显不一致。
      partial: 基本准确，但偏常识性、泛泛而谈。具体证据、数据、案例或分析不足。
      mostly: 信息准确且有用，包含具体数据、案例、论据或清晰分析，没有关键错误。
      fully: 信息专业、有洞察，能形成高质量判断，数据、图表、文字结论高度一致。
    notes:
      - 严重事实错误、伪造数据或伪造来源时，Content 模块原则上最高 59 分。

  - id: C3_focus_and_information_selection
    module: content
    name: 信息取舍与单页聚焦
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - instruction
      - rendered_image
    definition: 是否适合一页讲清楚，是否避免过载、过空、冗余以及重点不突出。
    evaluation: >-
      判断核心信息、支撑信息和细节是否分层，并检查信息密度是否匹配单页沟通场景，而非只按文字数量评分。
    anchors:
      not_met: 信息严重失控，无法阅读，或几乎没有有效内容。
      weak: 明显过载或过空。重点被大量冗余信息淹没，或只有口号没有支撑。
      partial: 信息量基本够，但主次关系不够清楚，存在冗余或遗漏。
      mostly: 取舍合理，重点、补充信息和细节层级清楚，适合单页呈现。
      fully: 复杂内容被压缩成清楚的一页，密度与场景高度匹配，重点和支撑关系非常自然。
    notes:
      - 文字多不必然扣分，关键是是否符合使用场景且能被清楚组织。

  - id: C4_context_and_audience_fit
    module: content
    name: 场景与受众内容适配
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - instruction
      - rendered_image
    definition: 内容深度、语气、措辞以及业务、技术、教学或营销 framing 是否匹配使用场景和目标受众。
    evaluation: >-
      从 instruction 识别受众、用途和期望行动，再判断内容深度、术语、解释粒度、语气和论证方式是否匹配。
    anchors:
      not_met: 完全不适合目标受众或使用场景，例如技术汇报变成广告口号。
      weak: 多数内容错位，语气、深度或表达方式与受众需求明显不匹配。
      partial: 大方向基本合适，但部分内容太浅、太深、太口号化或太学术化。
      mostly: 内容深度和语气基本匹配目标受众与使用场景，只有轻微偏差。
      fully: 高度贴合受众和场景，像是为该场景专门写的一页，可直接用于目标沟通。

  - id: A1_composition_layout
    module: aesthetic
    name: 构图与版式组织
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - rendered_image
    definition: 评估画面组织、重心、留白、比例、阅读或观看路径。
    evaluation: 只根据渲染图评价视觉中心、主次关系、对齐、留白、节奏和阅读路径。
    anchors:
      not_met: 构图失效。主体散乱或缺失，画面没有稳定重心，主要元素堆叠、错位、拥挤或分散到难以观看。
      weak: 构图弱成立。能看出基本布局，但主次不明、重心不稳、观看路径混乱，视觉组织明显吃力。
      partial: 构图基本合格。主体和主要区域能识别，画面有基本秩序，但留白、层级、对齐、节奏仍有明显优化空间。
      mostly: 构图良好。视觉中心明确，主次关系清楚，阅读或观看路径基本自然，局部可能有轻微拥挤或失衡。
      fully: 构图优秀。画面组织成熟，重心、留白、节奏、比例和路径高度协调，注意力被有效引导，几乎无需调整。

  - id: A2_visual_elements_hierarchy
    module: aesthetic
    name: 视觉元素与层次结构
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - rendered_image
    definition: 评估色彩、明暗、形态、文字块关系、空间层次和主体层级。
    evaluation: 只根据渲染图检查配色、光影、字形、图像、形态和空间关系是否形成稳定视觉秩序。
    anchors:
      not_met: 视觉元素关系失效。色彩、明暗、形态或空间严重冲突，主体层次不可读，画面显著脏乱或破碎。
      weak: 视觉元素弱成立。能辨认主要元素，但色彩搭配、光影关系、形体结构、文字块关系或空间层次存在明显问题。
      partial: 视觉元素基本合格。色彩和明暗关系大体成立，主体层次可读，但协调性、精致度或空间组织一般。
      mostly: 视觉元素良好。配色、光影、字形、图像、形态和层级较协调，主体突出，画面有稳定的视觉秩序。
      fully: 视觉元素优秀。色彩、明暗、字形、图像、形态、材质和空间关系高度统一且有表现力，视觉层次清楚丰富。

  - id: A3_technical_execution
    module: aesthetic
    name: 技术执行与生成完成度
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - rendered_image
    definition: 评估主体稳定性、清晰度、细节、边缘、纹理、文字、渲染状态和导出质量。
    evaluation: 只评价最终可见结果的制作完成度，不把有意的风格化处理本身视为技术缺陷。
    anchors:
      not_met: 技术执行失败。主体崩坏、严重畸形、严重模糊、渲染损坏或半成品状态明显，无法作为完整视觉结果。
      weak: 技术执行较弱。主体能辨认，但存在明显 AI 畸形、纹理错误、文字错误、边缘破损、渲染异常、错位或完成度不足。
      partial: 技术执行基本合格。整体可用，主要内容完整，但局部清晰度、细节、边缘、文字、材质或导出质量有明显优化空间。
      mostly: 技术执行良好。画面清晰完整，主体稳定，细节较扎实，仅有少量不影响主体观感的小瑕疵。
      fully: 技术执行优秀。生成或制作完成度高，细节、边缘、纹理、渲染、文字和元素状态都稳定自然，几乎无可见技术瑕疵。

  - id: A4_style_media_topic_fit
    module: aesthetic
    name: 风格统一与媒介/主题适配
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - instruction
      - rendered_image
    definition: 评估字体、色彩、图像、装饰、材质和组件语言与主题、媒介及使用场景的一致性。
    evaluation: 结合 instruction 和渲染图，判断页面是否形成一致的视觉语言，以及该语言是否适合主题气质和单页演示媒介。
    anchors:
      not_met: 风格失效。元素像随机拼贴，字体、色彩、图像、装饰、材质或组件语言严重冲突，整体不成体系。
      weak: 风格弱成立。能看出某种风格方向，但素材、字体、图标、图表、装饰或媒介语言混杂，统一性较差。
      partial: 风格基本合格。整体风格大体统一，适合当前媒介和主题的基本要求，但视觉语言较普通或局部不匹配。
      mostly: 风格良好。视觉语言清楚统一，素材和组件选择较一致，整体适合对应媒介、主题气质和使用场景。
      fully: 风格优秀。风格系统成熟，字体、配色、材质、图形、组件、媒介特性和主题气质高度一致，整体稳定专业。

  - id: A5_overall_aesthetic_first_impression
    module: aesthetic
    name: 整体美观与第一眼观感
    evaluation_mode: visual
    allow_na: false
    evidence_sources:
      - rendered_image
    definition: 评估第一眼观感、完整感、协调性、专业质感、吸引力和记忆点。
    evaluation: 先评价整体第一印象，再结合全页检查这种印象是否由真实的完成度、协调性和视觉吸引力支撑。
    anchors:
      not_met: 整体观感失败。第一眼明显破碎、刺眼、廉价、混乱或不完整，难以被认为是美观结果。
      weak: 整体观感较弱。画面有少量可取之处，但整体不够舒服、不够稳定或不够完整，美观度明显偏低。
      partial: 整体观感基本合格。画面能接受，主要视觉问题不至于破坏整体，但吸引力、精致度或协调性一般。
      mostly: 整体观感良好。第一眼较美观，画面完整协调，有一定吸引力和专业感，少量问题不影响整体印象。
      fully: 整体观感优秀。第一眼美观且完成感强，视觉吸引力、整体协调性、专业质感和可观察记忆点突出，可作为高质量样例。

  - id: H1_runnability_self_containment
    module: html
    name: 渲染稳定性与独立性
    evaluation_mode: html
    allow_na: false
    evidence_sources:
      - html
      - css
      - dom_audit
    definition: 断网脱机环境下，页面能否稳定、瞬间渲染；检查致命报错、死循环、未处理异常及对外部图片、字体和 CDN 的强依赖。
    evaluation: >-
      必须在断网、干净的 Chromium 环境中测试首次渲染，检查必要资源是否内嵌、是否有致命 console error、是否存在阻塞或持续卡顿。
    anchors:
      not_met: 无法打开或白屏。核心内容强依赖外部网络，断网后只剩空壳，或存在致命报错中断渲染。
      weak: 渲染勉强可见，但断网后重要图片或 CSS 失效；含有大量未授权外部请求，页面有持续卡顿或错误。
      partial: 断网可看清核心主体内容。存在非致命警告，依赖少量非必要外部网络请求，但不影响整体阅读。
      mostly: 基本自包含，例如使用 Base64 或内联 SVG；无严重报错，稳定快速呈现，仅个别非核心装饰依赖网络。
      fully: 完美单文件。完全离线运行、加载零延迟、无报错，一切必要资源均独立内嵌。
    notes:
      - 若断网后核心文本都无法展现，本维度直接计 0 分。

  - id: H2_canvas_geometry_spatial_relations
    module: html
    name: 画布几何与空间关系
    evaluation_mode: html
    allow_na: false
    evidence_sources:
      - html
      - css
      - dom_audit
    definition: 是否构建稳定的 16:9 画布，是否存在非预期重叠遮挡、文字溢出裁切，以及模块上下左右关系是否正确。
    evaluation: >-
      使用 bounding box 在 720p 和 1080p 等标准分辨率检查画布比例、越界、重叠、截断、间距、对齐和相对空间关系。
    anchors:
      not_met: 无演示画布概念。大面积内容飞出视口并被彻底裁切，模块关系严重混乱，互相遮挡导致文字不可读。
      weak: 比例错误或部分变形。存在明显内容重叠和截断，要求的左右或上下空间关系发生大幅度错位。
      partial: 建立基础画布，基本为 16:9。空间结构大体符合要求，局部存在轻微碰撞或错位，但基本不影响认字。
      mostly: 画布结构规范，多分辨率下不越界。模块间位置、间距与对齐关系基本准确，无非预期遮挡。
      fully: 绝对几何安全。严格适配 16:9 并自动缩放，关系图中的相对空间精准，0 溢出、0 遮挡、完美对齐。
    notes:
      - 合理的层叠，例如文字位于色块正上方，属于正常设计，不应判为重叠错误。

  - id: H3_semantic_dom_logical_structure
    module: html
    name: 可见语义 DOM 与逻辑结构
    evaluation_mode: html
    allow_na: false
    evidence_sources:
      - html
      - css
      - dom_audit
    definition: 正文和图表是否由真实 DOM 节点构成，DOM 树容器包裹逻辑是否合理，以及代码书写顺序是否与视觉阅读顺序一致。
    evaluation: >-
      拒绝纯截图。检查真实文本、可机读内容、逻辑分组、标签语义、DOM 层级与源码顺序是否支持从上到下的阅读和二次处理。
    anchors:
      not_met: 全页用单张纯图、canvas 或 img 冒充，无真实可读文字，或 DOM 顺序极度混乱颠倒。
      weak: 约一半内容可机读，但逻辑乱套，例如视觉同一卡片的代码散落各处；滥用标签，源码顺序与视觉严重脱节。
      partial: 多数主体由真实文本或 DOM 构成，有基本分组包裹容器，DOM 书写顺序基本符合从上到下的逻辑。
      mostly: 内容全部可机读、可选定，逻辑分组明确，文字和图表被正确包裹在对应父容器下，标签语义合理。
      fully: 纯正结构树。完全拒绝栅格化偷懒，高精度逻辑分组，DOM 树清晰反映卡片结构，代码流顺序与人类阅读路径完全吻合。
    notes:
      - 发现整页直接采用单图或单 canvas 栅格化作弊时，本维度计 0 分，HTML 模块总分最高 19 分。

  - id: H4_code_maintainability_editability
    module: html
    name: 代码可维护性与二次编辑
    evaluation_mode: html
    allow_na: false
    evidence_sources:
      - html
      - css
      - dom_audit
    definition: 生成代码是否易于人类二次修改文案和配色，CSS 是否清晰解耦，是否清除了大量冗余死代码。
    evaluation: >-
      检查模块边界、DOM 嵌套、独立 style 块、CSS 分类、变量复用、inline style、绝对定位耦合和编辑探针结果。
    anchors:
      not_met: 存在几万行死代码或严重混淆；改一个字会导致全页排版彻底崩溃，全部是杂乱无章的 inline style。
      weak: 重度依赖绝对定位硬编码，文字稍微变长即越界；嵌套极深，例如超过 15 层 div，CSS 与内容高度耦合。
      partial: 模块边界能够辨认，有独立 style 样式块；存在少部分冗余代码，一般用户能勉强修改文字。
      mostly: 结构较清晰，主要元素能够被独立定位修改；CSS 有初步分类，例如分离排版类和颜色类，仅有少量冗余。
      fully: 极致可维护。结构优美扁平，运用 CSS 变量控制主题颜色，代码逻辑和样式分离，人类可快速定位并修改文本。
    notes:
      - Edit Probe 中加长标题文字后若布局直接崩塌，本维度不得高于 39 分。

  - id: H5_evaluation_integrity_anti_gaming
    module: html
    name: 评测诚信与反投机检测
    evaluation_mode: html
    allow_na: false
    evidence_sources:
      - html
      - css
      - dom_audit
    definition: 拒绝前置交互与作弊手段，检测 opacity:0、零尺寸、移出屏幕外等隐藏关键词，以及动态长动画等规避评测的做法。
    evaluation: >-
      对照首屏渲染与 DOM，检查 opacity、visibility、text-indent、尺寸、坐标、颜色、动画和交互依赖；要求内容静态、瞬间、真实可见地呈现。
    anchors:
      not_met: 存在系统性作弊，例如大量隐藏关键词，或故意将字体颜色设置为背景色以骗取文本命中率。
      weak: 存在多个可疑隐藏节点，或核心文本必须依赖 hover、前置交互或等待极长的无意义动画才能看到。
      partial: 总体诚实，但存在个别无意义的隐藏废节点，可能源于模型生成幻觉，且不影响画面。
      mostly: 所见即代码。所有 DOM 文本都在视觉上可见，无需前置交互或等待，页面加载后内容直接呈现。
      fully: 绝对可信。检查 opacity、visibility、text-indent 等属性后无隐藏作弊，所需展示信息在首屏真实、静态、瞬间呈现。
    notes:
      - 发现模型为满足 prompt 刻意将关键词埋入不可见区域投机时，本维度计 0 分，HTML 模块总分最高 19 分。
      - 要求纯静态展现。
