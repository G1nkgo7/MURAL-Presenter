<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
<script>globalThis.STUDIO_BASE_PATH = {{ request.scope.get('root_path', '')|tojson }};</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MURAL Presenter{% endblock %}</title>
  <script>
    try {
      const savedTheme = localStorage.getItem("studio_theme");
      const theme = savedTheme === "dark" || savedTheme === "light"
        ? savedTheme
        : "dark";
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      const savedLanguage = localStorage.getItem("studio_language");
      const serverLanguage = "{{ default_language|default('zh') }}" === "en" ? "en" : "zh";
      document.documentElement.lang = savedLanguage === "en" || savedLanguage === "zh"
        ? savedLanguage
        : serverLanguage;
    } catch (_) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="{{ request.scope.get('root_path', '') }}/static/logo.svg?v={{ asset_ver }}">
  <link rel="apple-touch-icon" href="{{ request.scope.get('root_path', '') }}/static/logo.svg?v={{ asset_ver }}">
  <link rel="stylesheet" href="{{ request.scope.get('root_path', '') }}/static/fonts/ui-cjk.css?v={{ asset_ver }}">
  <link rel="stylesheet" href="{{ request.scope.get('root_path', '') }}/static/app.css?v={{ asset_ver }}-previewFullBleed1">
</head>
<body>
{% block body %}{% endblock %}
  <script src="{{ request.scope.get('root_path', '') }}/static/app.js?v={{ asset_ver }}-showcaseOutdoor1-staticPageViewport1" defer></script>
</body>
</html>
